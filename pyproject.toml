[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crl-widowx"
version = "0.1.0"
description = "Contrastive Reinforcement Learning for WidowX250 pick-and-place in MuJoCo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2.0",
  "mujoco>=3.1.6",
  "gymnasium>=0.29.1",
  "numpy>=1.24.0",
  "wandb>=0.17.0",
  "imageio[ffmpeg]>=2.34.0",
  "tqdm>=4.66.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
